<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow,noarchive">
<title>🕸 客户关系图</title>
<style>
:root{--bg:#f3f5f8;--card:#fff;--text:#1e2b3a;--sub:#75859a;--line:#e3e8ef;--pri:#123a5e;--acc:#0f766e;--hl:#b45309;--hlbg:#fff8ec;--shadow:0 1px 3px rgba(16,36,56,.07)}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{background:var(--bg);color:var(--text)}
body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;line-height:1.6;padding-bottom:calc(40px + env(safe-area-inset-bottom));-webkit-font-smoothing:antialiased}
a{text-decoration:none;color:inherit}
header{position:sticky;top:0;z-index:30;background:linear-gradient(150deg,#1c3450,#0e2438);color:#fff;padding:calc(10px + env(safe-area-inset-top)) 14px 12px;box-shadow:0 2px 10px rgba(10,25,40,.22)}
header h1{font-size:17px;font-weight:800;letter-spacing:.4px}
header .sub{font-size:11px;color:#a9c3dc;margin-top:3px}
.nav{display:flex;gap:6px;flex-wrap:wrap;padding:9px 0 1px}
.nav a{flex:0 0 auto;font-size:11.5px;color:#dcebf9;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.18);padding:5px 11px;border-radius:13px}
.nav a.on{background:#fff;color:#12304b;font-weight:700;border-color:#fff}
main{padding:12px 12px 0;max-width:760px;margin:0 auto}
.kpis{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.kpi{flex:1 1 calc(50% - 5px);min-width:0;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;box-shadow:var(--shadow)}
.kpi b{display:block;font-size:19px;color:var(--pri);line-height:1.3;white-space:nowrap}
.kpi span{font-size:10.5px;color:var(--sub)}
.sec{margin-bottom:16px}
.sec h2{font-size:12.5px;color:var(--pri);display:flex;align-items:center;gap:8px;padding:4px 2px 8px}
.sec h2::before{content:"";width:3px;height:13px;background:var(--acc);border-radius:2px}
.sec h2 span{margin-left:auto;font-size:10.5px;color:var(--sub);font-weight:400}
.card{display:block;background:var(--card);border-radius:12px;padding:11px 13px;margin-bottom:8px;box-shadow:var(--shadow);border-left:3px solid transparent}
.card.hl{border-left-color:var(--hl);background:var(--hlbg)}
.card .t{font-size:14px;font-weight:600;line-height:1.45}
.card .u{font-size:11px;color:var(--acc);font-weight:600;margin-bottom:2px}
.card .m{font-size:12px;color:#5c6d80;margin-top:5px;line-height:1.65}
.card .row{display:flex;gap:8px;align-items:baseline;margin-top:4px}
.card .amt{font-size:12px;color:var(--hl);font-weight:700}
.card .d{font-size:10.5px;color:#a3b1c0;margin-left:auto}
.empty{text-align:center;color:var(--sub);font-size:12.5px;padding:30px 0}
.foot{text-align:center;font-size:10.5px;color:var(--sub);padding:16px 10px 4px;line-height:1.9}

.graph{background:var(--card);border-radius:14px;box-shadow:var(--shadow);padding:6px}
.graph svg{width:100%;height:auto;display:block}
.legend{display:flex;gap:10px;font-size:10.5px;color:var(--sub);padding:6px 2px 2px;flex-wrap:wrap}
.panel{background:var(--card);border-radius:14px;padding:14px;margin-top:12px;box-shadow:var(--shadow)}
.panel h3{font-size:15px;margin-bottom:2px}
.panel .ps{font-size:11.5px;color:var(--sub);margin-bottom:8px}
.panel .prow{font-size:12.5px;padding:6px 0;border-top:1px dashed var(--line);display:flex;gap:8px}
.panel .prow b{flex:0 0 62px;color:var(--sub);font-weight:600;font-size:11.5px}
</style>
</head>
<body>
<header><h1>🕸 客户关系图</h1><div class="sub">中心是我 · 外围是客户单位 · 点击看一把手与对接关系</div><div class="nav"><a href="changji.html">📇 常记</a><a href="biji.html">📘 笔记</a><a href="https://suzhou-renshi.github.io/suzhou-renshi/">🏛 人事</a><a href="riji.html">📖 日记</a><a href="week.html">✅ 周行动</a><a href="biz.html">💰 商机大盘</a><a href="card.html">🪪 速查卡</a><a href="map.html" class="on">🕸 关系图</a></div></header>
<main id="view"><div id="view"></div></main>
<div class="foot">数据来源：常记看板（只读汇总）· 内部资料 请勿外传</div>
<script src="kv_data.js"></script>
<script>var DATA=KV_DATA;

function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
var units=[];
DATA.forEach(function(u,i){
  var pn=0;(u.depts||[]).forEach(function(d){pn+=d.people.length;});
  var hr=(u.hr&&u.hr.people)||[];
  var proj=(u.projects||[]).filter(function(p){return p.st==='opp';}).length;
  if(!hr.length&&!pn&&!proj)return;
  units.push({i:i,name:u.short||u.title,title:u.title,hr:hr.slice(0,3),pn:pn,proj:proj,depts:(u.depts||[]).map(function(d){return d.dept;})});
});
units.sort(function(a,b){return (b.proj*3+b.pn)-(a.proj*3+a.pn);});
units=units.slice(0,12);
var W=380,H=392,cx=190,cy=196,R=142;
var svg='<svg viewBox="0 0 '+W+' '+H+'">';
units.forEach(function(u,k){
  var ang=-Math.PI/2+k*2*Math.PI/units.length;
  var x=cx+Math.cos(ang)*R,y=cy+Math.sin(ang)*R;
  u.x=x;u.y=y;
  svg+='<line x1="'+cx+'" y1="'+cy+'" x2="'+x.toFixed(1)+'" y2="'+y.toFixed(1)+'" stroke="#dfe7ef" stroke-width="1.2"/>';
});
svg+='<circle cx="'+cx+'" cy="'+cy+'" r="26" fill="#123a5e"/>';
svg+='<text x="'+cx+'" y="'+(cy+5)+'" text-anchor="middle" fill="#fff" font-size="14" font-weight="700">我</text>';
units.forEach(function(u,k){
  var r=Math.min(24,13+u.proj*1.3);
  svg+='<g class="nd" data-k="'+k+'" style="cursor:pointer">';
  svg+='<circle cx="'+u.x.toFixed(1)+'" cy="'+u.y.toFixed(1)+'" r="'+r.toFixed(1)+'" fill="#eaf2f8" stroke="#3d7ea6" stroke-width="1.3"/>';
  svg+='<text x="'+u.x.toFixed(1)+'" y="'+(u.y+3.2).toFixed(1)+'" text-anchor="middle" font-size="9.5" font-weight="600" fill="#123a5e">'+esc(u.name.slice(0,3))+'</text>';
  svg+='<text x="'+u.x.toFixed(1)+'" y="'+(u.y+r+10).toFixed(1)+'" text-anchor="middle" font-size="7.5" fill="#75859a">'+u.proj+' 商机</text>';
  svg+='</g>';
});
svg+='</svg>';
var h='<div class="graph">'+svg+'<div class="legend"><span>● 圆越大 = 在跟商机越多</span><span>共 '+units.length+' 个客户单位</span></div></div>';
h+='<div class="panel" id="panel"><h3>点一个单位看关系</h3><div class="ps">中心是你，外围是客户单位，点开可看一把手、对接部门与商机数</div></div>';
document.getElementById('view').innerHTML=h;
document.querySelectorAll('.nd').forEach(function(g){
  g.addEventListener('click',function(){
    var u=units[+g.dataset.k];
    var p=document.getElementById('panel');
    p.innerHTML='<h3>'+esc(u.title)+'</h3><div class="ps">'+u.pn+' 位对接人 · '+u.proj+' 个在跟商机</div>'
      +'<div class="prow"><b>一把手</b><span>'+esc(u.hr.length?u.hr.map(function(x){return x.name+(x.rl?'（'+x.rl+'）':'');}).join('、'):'—')+'</span></div>'
      +'<div class="prow"><b>部门</b><span>'+esc(u.depts.length?u.depts.join(' / '):'—')+'</span></div>'
      +'<div class="prow"><b>入口</b><span><a href="changji.html#u-'+u.i+'" style="color:#0f766e">打开常记卡片 ›</a></span></div>';
    window.scrollTo({top:document.body.scrollHeight,behavior:'smooth'});
  });
});
</script>
</body>
</html>
