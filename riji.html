<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>我的日记本 · 记录与总结</title>
<style>
  :root{
    --bg:#f4f6fa; --card:#ffffff; --ink:#1f2937; --sub:#6b7280; --line:#e6eaf1;
    --brand:#3b5bdb; --brand2:#5c7cfa; --shadow:0 6px 20px rgba(31,41,55,.07);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html{scroll-behavior:smooth;}
  body{margin:0;background:linear-gradient(180deg,#eef2f9 0%,#f4f6fa 240px,#f4f6fa 100%);
    color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    line-height:1.7;font-size:15px;}
  .wrap{max-width:840px;margin:0 auto;padding:0 16px 80px;}

  /* header */
  header.top{padding:34px 4px 18px;}
  .brand{font-size:12px;letter-spacing:2px;color:var(--brand);font-weight:700;text-transform:uppercase;}
  h1{margin:6px 0 4px;font-size:27px;letter-spacing:1px;font-weight:800;}
  .lead{color:var(--sub);font-size:13.5px;margin:0;}
  .stats{display:flex;gap:12px;margin-top:18px;flex-wrap:wrap;}
  .stat{flex:1;min-width:96px;background:var(--card);border:1px solid var(--line);border-radius:14px;
    padding:12px 14px;box-shadow:var(--shadow);}
  .stat b{display:block;font-size:22px;color:var(--brand);font-weight:800;line-height:1.2;}
  .stat span{font-size:12px;color:var(--sub);}

  /* sticky bar */
  .bar{position:sticky;top:0;z-index:20;margin:18px 0 22px;padding:10px 0;
    background:rgba(244,246,250,.86);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
    border-bottom:1px solid var(--line);}
  .search{width:100%;padding:11px 15px;border:1px solid var(--line);border-radius:12px;
    background:var(--card);font-size:14px;color:var(--ink);outline:none;box-shadow:var(--shadow);}
  .search:focus{border-color:var(--brand2);}
  .nav{display:flex;gap:8px;overflow-x:auto;padding:10px 2px 2px;scrollbar-width:thin;}
  .nav::-webkit-scrollbar{height:5px;} .nav::-webkit-scrollbar-thumb{background:#cdd5e3;border-radius:3px;}
  .nav a{flex:0 0 auto;font-size:12.5px;color:#41506b;background:var(--card);border:1px solid var(--line);
    padding:6px 12px;border-radius:20px;text-decoration:none;white-space:nowrap;}
  .nav a:hover{border-color:var(--brand2);color:var(--brand);}

  /* day block */
  .day{margin:0 0 26px;scroll-margin-top:130px;}
  .day-head{display:flex;align-items:baseline;gap:12px;margin:0 2px 12px;}
  .day-date{font-size:19px;font-weight:800;letter-spacing:.5px;}
  .day-week{font-size:12.5px;color:#fff;background:var(--brand);padding:1px 9px;border-radius:20px;}
  .day-count{font-size:12.5px;color:var(--sub);margin-left:auto;}

  .entry{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px 18px 15px;
    box-shadow:var(--shadow);margin-bottom:12px;position:relative;overflow:hidden;}
  .entry::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--brand2);}
  .entry .txt{white-space:pre-wrap;word-break:break-word;font-size:15px;}
  .entry .meta{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:10px;}
  .tag{font-size:11.5px;padding:2px 10px;border-radius:20px;font-weight:600;border:1px solid transparent;}
  .tag.t0{background:#e7f7ee;color:#1f9d55;border-color:#c6ecd6;}   /* 健康·生活 */
  .tag.t1{background:#efeafd;color:#6d43d1;border-color:#ddd0fb;}   /* 心得体会 */
  .tag.t2{background:#e8f0fe;color:#2f5bd8;border-color:#cfe0fd;}   /* 工作·客户 */
  .tag.t3{background:#fff2e2;color:#c9770b;border-color:#ffe0bf;}   /* 看板·工具 */
  .tag.t4{background:#e3f6f6;color:#0d8f8f;border-color:#c4ecec;}   /* 学习·技术 */
  .tag.t5{background:#eef0f4;color:#5b6472;border-color:#e0e4ea;}   /* 其他 */
  .tm{font-size:12px;color:#9aa3b2;margin-left:auto;}

  /* summary */
  .summary{margin-top:14px;background:linear-gradient(160deg,#ffffff,#f7f9ff);
    border:1px solid var(--line);border-radius:18px;padding:22px 20px;box-shadow:var(--shadow);}
  .summary h2{margin:0 0 4px;font-size:19px;font-weight:800;}
  .summary .s-sub{color:var(--sub);font-size:13px;margin:0 0 18px;}
  .bar-row{display:flex;align-items:center;gap:10px;margin:10px 0;}
  .bar-row .lb{flex:0 0 92px;font-size:13px;color:#3d4757;font-weight:600;}
  .bar-track{flex:1;height:9px;background:#eceff5;border-radius:6px;overflow:hidden;}
  .bar-fill{height:100%;border-radius:6px;background:linear-gradient(90deg,var(--brand2),var(--brand));}
  .bar-row .num{flex:0 0 atuo;font-size:12px;color:var(--sub);min-width:44px;text-align:right;}
  .s-text{margin-top:16px;font-size:14px;color:#374151;background:#f6f8fc;border-left:3px solid var(--brand2);
    border-radius:0 10px 10px 0;padding:12px 15px;}
  .empty{padding:40px 10px;text-align:center;color:var(--sub);}
  .empty b{color:var(--ink);}

  #toTop{position:fixed;right:18px;bottom:22px;width:46px;height:46px;border-radius:50%;border:none;
    background:var(--brand);color:#fff;font-size:20px;cursor:pointer;box-shadow:0 6px 18px rgba(59,91,219,.4);
    opacity:0;pointer-events:none;transition:.3s;z-index:30;}
  #toTop.show{opacity:1;pointer-events:auto;}
  .hidden{display:none !important;}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand">DAILY JOURNAL</div>
    <h1>我的日记本</h1>
    <p class="lead">按日期记录 · 自动归纳心得体会。想到什么、做了什么，随时说「日常记录 …」即可追加。</p>
    <div class="stats" id="stats"></div>
  </header>

  <div class="bar">
    <input class="search" id="search" type="text" placeholder="搜索记录内容或标签…">
    <div class="nav" id="nav"></div>
  </div>

  <main id="days"></main>

  <section class="summary" id="summary">
    <h2>心得体会 · 归纳总结</h2>
    <p class="s-sub" id="sumSub"></p>
    <div id="sumBars"></div>
    <div class="s-text" id="sumText"></div>
  </section>
</div>

<button id="toTop" title="回到顶部">↑</button>

<script>
/* ===== 日记数据开始（后续新增只需往数组里追加一行） ===== */
const ENTRIES = [
  { date:"2026-11-18", time:"10:20", tags:["健康·生活","心得体会"],
    text:"决定戒酒。以电影《后会无期》里「小孩子才分对错，成年人只看利弊」为鉴——凡事不凭感觉走，事前仔细权衡利弊、值不值得；明知伤身的事就不做。戒酒这件事，趁早。" },
  { date:"2026-11-18", time:"11:39", tags:["健康·生活","心得体会"],
    text:"连续几天夜里1点多才睡、早上6点半就醒，睡眠根本不够，困得不得了。这种状态我试过：早上硬撑着爬起来去上班，一整天都很累，一天天都很累，真的很想好好睡一觉。看陈主任精力那么旺盛，我想很重要的一点是他不像我这样熬夜、晚上睡得踏实，才有力气去处理单位上的事。所以精力很重要，保持精力旺盛的状态很重要。我记下来提醒自己：不能这么熬夜了，得想办法睡好，太难受了。" }
];
/* ===== 日记数据结束 ===== */

const TAG_CLASS = { "健康·生活":"t0", "心得体会":"t1", "工作·客户":"t2", "看板·工具":"t3", "学习·技术":"t4", "其他":"t5" };
const WEEK = ["周日","周一","周二","周三","周四","周五","周六"];

function weekOf(d){ const p=d.split("-"); const dt=new Date(+p[0],+p[1]-1,+p[2]); return WEEK[dt.getDay()]; }

// 按日期分组（倒序）
function grouped(list){
  const map = {};
  list.forEach(e=>{ (map[e.date]=map[e.date]||[]).push(e); });
  return Object.keys(map).sort((a,b)=> b.localeCompare(a)).map(d=>({date:d, items:map[d]}));
}

function tagHTML(t){ return `<span class="tag ${TAG_CLASS[t]||'t5'}">${t}</span>`; }

function renderStats(){
  const days = new Set(ENTRIES.map(e=>e.date)).size;
  const total = ENTRIES.length;
  const last = ENTRIES.length ? ENTRIES.map(e=>e.date).sort().slice(-1)[0] : "—";
  document.getElementById("stats").innerHTML = `
    <div class="stat"><b>${days}</b><span>记录天数</span></div>
    <div class="stat"><b>${total}</b><span>心得条数</span></div>
    <div class="stat"><b style="font-size:16px">${last}</b><span>最新记录</span></div>`;
}

function renderNav(groups){
  const nav = document.getElementById("nav");
  if(!ENTRIES.length){ nav.innerHTML=""; return; }
  nav.innerHTML = groups.map(g=>`<a href="#d-${g.date}">${g.date.slice(5)} ${weekOf(g.date)}</a>`).join("");
}

function renderDays(groups, filter){
  const box = document.getElementById("days");
  if(!ENTRIES.length){
    box.innerHTML = `<div class="empty">还没有记录。<br><b>从今天起，说一句「日常记录 …」</b>，我就帮你记到这里。</div>`;
    return;
  }
  const f = (filter||"").trim().toLowerCase();
  let html = "";
  groups.forEach(g=>{
    let items = g.items;
    if(f){ items = items.filter(e=> (e.text+" "+e.tags.join(" ")).toLowerCase().includes(f)); }
    if(!items.length) return;
    html += `<section class="day" id="d-${g.date}">
      <div class="day-head"><span class="day-date">${g.date.replace(/-/g,"·")}</span>
        <span class="day-week">${weekOf(g.date)}</span>
        <span class="day-count">${items.length} 条</span></div>`;
    items.forEach(e=>{
      html += `<div class="entry"><div class="txt">${esc(e.text)}</div>
        <div class="meta">${e.tags.map(tagHTML).join("")}<span class="tm">${e.time||""}</span></div></div>`;
    });
    html += `</section>`;
  });
  box.innerHTML = html || `<div class="empty">没有匹配「${esc(filter)}」的记录。</div>`;
}

function renderSummary(){
  const cnt = {};
  ENTRIES.forEach(e=> e.tags.forEach(t=> cnt[t]=(cnt[t]||0)+1));
  const arr = Object.keys(cnt).map(t=>({t,c:cnt[t]})).sort((a,b)=>b.c-a.c);
  const max = arr.length ? arr[0].c : 1;
  const days = new Set(ENTRIES.map(e=>e.date)).size;
  document.getElementById("sumSub").textContent =
    `共记录 ${days} 天 · ${ENTRIES.length} 条心得，按主题归纳如下：`;
  if(!arr.length){
    document.getElementById("sumBars").innerHTML="";
    document.getElementById("sumText").textContent = "还没有记录，开始写第一条吧。";
    return;
  }
  document.getElementById("sumBars").innerHTML = arr.map(a=>`
    <div class="bar-row"><span class="lb">${a.t}</span>
      <span class="bar-track"><span class="bar-fill" style="width:${Math.round(a.c/max*100)}%"></span></span>
      <span class="num">${a.c} 条</span></div>`).join("");

  const top = arr.filter(a=>a.c===max).map(a=>a.t).join("、");
  const parts = arr.map(a=>`${a.t}（${a.c} 条）`).join("、");
  document.getElementById("sumText").innerHTML =
    `<b>聚焦方向：</b>${parts}。<br>目前记录的重心在 <b>${top}</b>。` +
    (ENTRIES.length<3? `记录刚起步，先把每天冒出来的念头随手记下，积累几天后这里会自然长出你的「主题地图」。`
       : `可以回看这些主题，看看哪些是反复出现的心结或成长线。`);
}

function esc(s){ return String(s).replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

function draw(filter){
  const groups = grouped(ENTRIES);
  renderNav(groups);
  renderDays(groups, filter);
}

document.getElementById("search").addEventListener("input", e=> draw(e.target.value));

const toTop = document.getElementById("toTop");
window.addEventListener("scroll", ()=>{ toTop.classList.toggle("show", window.scrollY>400); });
toTop.addEventListener("click", ()=> window.scrollTo({top:0,behavior:"smooth"}));

renderStats();
renderSummary();
draw("");
</script>
</body>
</html>
