<!DOCTYPE html>
<html lang="zh-CN">
<head>

<title>工作笔记 · 知识看板</title>
<style>
:root{--primary:#0e5a8a;--text:#2c3e50;--text2:#6b7a8d;--bg:#f2f5f8;--card:#fff;--accent:#0e7490}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--text);line-height:1.65;padding-bottom:60px}
header{background:linear-gradient(135deg,#2a3f5f,#0e2a47);color:#fff;padding:18px 16px 14px;position:sticky;top:0;z-index:10;box-shadow:0 3px 10px rgba(14,42,71,.25)}
header h1{font-size:17px;letter-spacing:.5px}
header .sub{font-size:11px;color:#a8c4e0;margin-top:3px}
.hlinks{margin-top:10px;display:flex;gap:8px;flex-wrap:wrap}
.hlinks a{font-size:11px;color:#d9e8f7;background:rgba(255,255,255,.13);padding:4px 10px;border-radius:12px;border:1px solid rgba(255,255,255,.2);text-decoration:none}
.searchbox{margin:10px 12px 6px;background:#fff;border-radius:10px;display:flex;align-items:center;padding:8px 12px;box-shadow:0 2px 6px rgba(0,0,0,.06)}
.searchbox input{flex:1;border:none;outline:none;font-size:13px;background:transparent}
.hint{margin:4px 14px 8px;font-size:10.5px;color:var(--text2)}
details.tip{margin:4px 12px 8px;background:#fffdf3;border:1px solid #e9e2c0;border-radius:10px;padding:6px 12px;font-size:11px;color:#8a7a3a}
details.tip b{color:#0e5a8a;background:#e8f4fb;border:1px solid #c9e7f7;padding:0 6px;border-radius:5px;font-size:10.5px;margin-right:4px}
.tip-item{margin-top:5px;white-space:normal;line-height:1.6}
main{padding:8px 12px}
.cat{margin-bottom:14px}
.cat-title{font-size:12.5px;font-weight:700;color:var(--primary);padding:6px 2px;display:flex;align-items:center;gap:6px;border-bottom:2px solid #dbe6f0;margin-bottom:8px}
.cat-title .n{font-size:10px;color:var(--text2);font-weight:500;margin-left:auto}
.note{background:var(--card);border-radius:10px;padding:10px 12px;margin-bottom:8px;box-shadow:0 1px 4px rgba(0,0,0,.06);border-left:3px solid var(--accent)}
.note h3{font-size:13px;color:var(--text);margin-bottom:4px;display:flex;align-items:baseline;gap:6px;flex-wrap:wrap}
.note h3 .d{font-size:10px;color:var(--text2);font-weight:400}
.note .body{font-size:12px;color:var(--text);white-space:pre-wrap;word-break:break-word}
.note .body a{color:var(--accent);word-break:break-all}
.note.hl{border-left-color:#d97706;background:#fffbf2}
.note.hl .body{color:#7c4a03}
footer{text-align:center;font-size:10px;color:#9fb0c0;padding:18px 0 8px}
mark{background:#fde68a;border-radius:2px;padding:0 1px}
empty{display:block;text-align:center;color:#9aa7b4;font-size:12px;padding:40px 0}
</style>
</head>
<body>
<header>
  <h1>📘 工作笔记 · 知识看板</h1>
  <div class="sub">我的工作知识库 · 用法心得 / 对接方案 / 场景与输出 · 与商机客情看板互补</div>
  <div class="hlinks">

  </div>
</header>
<div class="searchbox">🔍 <input id="q" type="text" placeholder="搜索 标题 / 分类 / 内容"></div>
<details class="tip"><summary>📌 怎么记笔记（对话维护，点开看）</summary>
  <div class="tip-item"><b>笔记-分类-标题-内容</b>记一条（分类可用：心得 / 对接 / 场景 / 输出 / 智能体 / 纪要，或自定义新分类）</div>
  <div class="tip-item"><b>重点笔记</b>内容前加"重要"两个字，卡片变橙色高亮</div>
</details>
<main id="list"></main>
<footer>工作笔记 · 本地数据自动同步至 GitHub Pages · noindex</footer>
<script>
var NOTES=[
 {cat:"纪要", title:"名城拜访交流纪要（戴峰主任/黄主任 · 50分钟录音转写整理）", d:"2026-11-27", hl:true, body:
"一、材料修改反馈（戴主任核心意见）\n· 集团处于项目建设期＋参观背景是党委班子研学，演示内容不要有推销感，要站在多年合作方角度\"帮集团出建议、出设想\"\n· 泛微 OA 合作已基本落地，AI 元素要在下一步泛微设计中体现出来（大趋势，领导态度开放）\n· 教育行业视频、合同审查、42 份周报自动汇总等演示获认可\"越用越顺\"；视频类材料继续用 AI 模型生成\n\n"+
"二、集团侧需求线索\n· 项目管理平台已有——希望 AI 提效：结构化数据自动出各类口径报送表格（10分钟出表、人工只校验）；可用 MCP/API 二开接入，TeleAgent 手机端语音录商机模式可复用\n· 票务数据打通分析：需先数据治理，最简单做法是 Excel 导出直接给智能体分析（参考卫健委幼儿园数据分析案例，客户反馈好用）\n· 舆情监测：对比专业厂商（智慧星光等），电信优势＝数据源可扩充 + 本地企业兜底服务 + 安全公司联动；有相城宣传部案例（负面三方监控+电信收集正面舆情出日报/周报）\n\n"+
"三、领导参观电信展厅安排\n· 集团整个班子要来参观（非一般客户接待，黄总提醒团队要加人准备）\n· 展厅容量 20-30 人、参观 30-40 分钟（红色通信历史 + AI 分行业能力）；会议室十几人一排\n\n"+
"四、展厅展陈结论\n· 现状：设备简单（一块屏+一台电脑+播控软件），墙面两年多已换过 3 次\n· 文宣科技公司去年做过华为中心类似项目 230 万（科技公司要包利润，报价策略要研究）\n· 打包思路：「泛微+AI」、展厅在改造期内可包装成信息化项目（装修的钱多）\n· 详细改造方案见下一条笔记\n\n五、待办：回去把今天意见融入材料修改；展厅方案先行、2-3 轮调整；后续随时联系"},

 {cat:"纪要", title:"名城展厅展陈 · 会议结论（详细版）", d:"2026-11-27", hl:false, body:
"一、背景：集团大展厅拟整体更新视觉系统（党委会两次提出），含宣传片、墙面与地面展示元素；现有展陈多为两年前制作的效果图、航拍图，固定播放、无联动互动，设备较简单。\n\n"+
"二、改造设想\n· 主轴「一屏看名城／古城」：所有业务在地图上呈现，点选细节\"甩\"至大屏，屏与内容联动、触摸互动，替代静态播放\n· 内容更新：实景图替代效果图，增加更新前后对比，补充近三四年成果、典型案例与国际奖项\n· 载体 AI 讲解：面向市民免费开放的书院类载体（名称待核实），增设电子讲解（典故、故事），兼顾市民体验与接待减负\n\n"+
"三、参考：电信展厅的互动形式（地屏联动、点选藏品弹出详情）可资借鉴\n\n"+
"四、周期与预算：先出方案、经 2-3 轮调整后落地，预计明年 6·18 前后呈现；时间与预算待定；两侧墙更换，主屏两块保留但内容改可联动版；展厅数字化或打包为信息化项目推进。\n\n（商机精要版已挂常记看板「言子书院展厅数字展陈」备忘）"},

 {cat:"TeleAgent", title:"常用入口（链接 · 持续补充）", d:"2026-11-28", hl:true, body:
"🌐 Web 入口：http://114.218.158.70:29450/ （TeleAgent 私有部署入口，内网/白名单访问）\n手机建议添加到主屏幕当作 App 用；后续有用得顺手的入口继续补在这里"},

 {cat:"TeleAgent", title:"用法 · 实战速记", d:"2026-11-27", hl:false, body:
"高频动作已固化成短语，照着说即可：\n· 「更新腾讯文档」——抓在线表格商机同步到看板（注意只抓到筛选后的可见区，需与存量合并防丢）\n· 「商机备忘-单位-商机-内容」——商机下挂青色 📅 备忘行，记拜访/进展\n· 「联想」——给人加紫色 💡 助记标签，只加不改名字\n· 「笔记-分类-标题-内容」——记工作心得到笔记看板\n· 「业务在用」——报数量或月消费，收入一律按月、保留 1 位小数\n· 截图/照片直接发——头像裁剪、楼层牌识别、地址加高德导航链接\n· docx 直接发——能读表格数据提炼上板（如广电业务表）\n· 录音文件可发——本地 Whisper 转写（耗时约为时长的一半，50 分钟音频约 70 分钟）"},

 {cat:"TeleAgent", title:"理解 · 智能体自用版", d:"2026-11-27", hl:false, body:
"· 智能体 ≠ 聊天机器人：差别在能调工具（浏览器、剪贴板、本机文件、后台任务），把\"说\"变成\"做\"\n· 最有价值的用法：把重复劳动固化成短语与记忆（常记看板高频短语就是例子），用一次沉淀一次\n· 边界要清楚：涉密不上网、私有数据本地处理（录音转写全程本地是底线）、金额数据口径唯一（业务在用按月）\n· 人永远把关：AI 给的是草稿和提醒，名字、职务、金额要自己扫一眼——已有过听音记错人名的教训（吴总→吴中）"},

 {cat:"TeleAgent", title:"实用心得 · 客户交流篇", d:"2026-11-27", hl:false, body:
"· 演示不要有推销感，站在多年合作方角度\"出建议出设想\"，对方自己会提需求，先听后讲\n· 客户提一条需求就沉淀一条到备忘/笔记，下次见面直接接上次话头，体验感拉满\n· 会前准备：把商机备忘和人员信息过一遍（看板搜索目标客户名即可），现场能叫出对接人名字最加分"},

 {cat:"对接", title:"泛微 OA 对接思路（框架 · 待实战补充）", d:"2026-11-27", hl:true, body:
"在跟案例：名城「OA 国泰新点改泛微」（110 万商机，泛微已汇报、AI 部分基本从电信过，12 月底上线目标，防国泰冲标）；国投「泛微 OA 升级」28 万已签约；国投产投私募 9 万签约推动中。\n\n"+
"对接方向（待实战补充细节）：\n· 接口层：泛微 e-cology 开放 API（待办/流程/消息推送），可由智能体或 RPA 调用\n· 场景层：流程审批 AI 预审、知识库问答嵌入门户、批量文档生成回写附件\n· 电信角色：算力/云资源 + 总包集成，厂商做平台适配\n（以上为框架思路，具体接口与案例待项目落地后补充实战结论）"},

 {cat:"场景", title:"主要场景与行业分类", d:"2026-11-27", hl:false, body:
"政企客户场景池（结合在跟单位总结）：\n· 展厅数字化（名城言子书院）、OA 信创替换（名城/国投）、灾备与云备份（国发/日报云灾备）、智慧养老（康养一键呼/慧养未来雷达）、殡葬数字化（民政省平台）、教育阅卷（云痕 AI 阅卷机）、医疗上门（卫健委试点）\n\n"+
"行业分类习惯：国资平台 / 文旅文投 / 民政医养 / 教育学校 / 传媒广电 / 金融国发 —— 每类客户的切入话术与案例可挂在各客户备忘里持续沉淀"},

 {cat:"输出", title:"智能体输出形式怎么选", d:"2026-11-27", hl:false, body:
"日常口头/对话能解决的最快；需要落盘交付时按场景选：\n· Word（docx）——正式报告、合同条款、给领导汇报的书面材料\n· PDF——排版要求高、防止对方改动的定稿（本机 Word/WPS 转 PDF 流程已跑通）\n· HTML 网页——看板类（常记/人事/日记/笔记都是），手机可查、随时更新\n· 表格 xlsx——清单、台账、商机统计\n· 图片/PPT——汇报演示、头像裁剪、信息图\n经验：同一份内容优先「数据 + 网页」长期维护，Word/PDF 只在交付时刻导出，避免双头维护"}
];

function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function linkify(h){return h.replace(/(https?):\/\/([^\s<]+)/i,function(m,p,rest){return '<a href="'+p+'://'+rest+'" target="_blank" rel="noopener">'+p+'://'+rest+'</a>';});}
function hi(t,q){if(!q)return esc(t);var i=t.toLowerCase().indexOf(q.toLowerCase());if(i<0)return esc(t);return esc(t.slice(0,i))+'<mark>'+esc(t.slice(i,i+q.length))+'</mark>'+esc(t.slice(i+q.length));}
function render(){
  var q=(document.getElementById('q').value||'').trim();
  var cats={};
  NOTES.forEach(function(n){
    if(q){
      var hay=(n.cat+' '+n.title+' '+n.body);
      if(hay.toLowerCase().indexOf(q.toLowerCase())<0)return;
    }
    (cats[n.cat]=cats[n.cat]||[]).push(n);
  });
  var h='';
  var order=["纪要","TeleAgent","对接","场景","输出"];
  Object.keys(cats).sort(function(a,b){var ia=order.indexOf(a),ib=order.indexOf(b);return (ia<0?99:ia)-(ib<0?99:ib);}).forEach(function(c){
    h+='<div class="cat"><div class="cat-title">'+hi(c,q)+' <span class="n">'+cats[c].length+' 条</span></div>';
    cats[c].forEach(function(n){
      h+='<div class="note'+(n.hl?' hl':'')+'"><h3>'+(n.cat==='TeleAgent'?'🤖':'📘')+' '+hi(n.title,q)+' <span class="d">'+esc(n.d)+'</span></h3><div class="body">'+linkify(hi(n.body,q))+'</div></div>';
    });
    h+='</div>';
  });
  document.getElementById('list').innerHTML=h||'<empty>未找到匹配笔记</empty>';
}
document.getElementById('q').addEventListener('input',render);
render();
</script>
