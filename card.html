<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow,noarchive">
<title>🪪 接待速查卡</title>
<style>
:root{--bg:#f3f5f8;--card:#fff;--text:#1e2b3a;--sub:#75859a;--line:#e3e8ef;--pri:#123a5e;--acc:#0f766e;--hl:#b45309;--hlbg:#fff8ec;--shadow:0 1px 3px rgba(16,36,56,.07)}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{background:var(--bg);color:var(--text)}
body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;line-height:1.6;padding-bottom:calc(40px + env(safe-area-inset-bottom));-webkit-font-smoothing:antialiased}
a{text-decoration:none;color:inherit}
header{position:sticky;top:0;z-index:30;background:linear-gradient(150deg,#1c3450,#0e2438);color:#fff;padding:calc(10px + env(safe-area-inset-top)) 14px 12px;box-shadow:0 2px 10px rgba(10,25,40,.22)}
header h1{font-size:17px;font-weight:800;letter-spacing:.4px}
header .sub{font-size:11px;color:#a9c3dc;margin-top:3px}
.nav{display:flex;gap:6px;flex-wrap:wrap;padding:9px 0 1px}
.nav a{flex:0 0 auto;font-size:11.5px;color:#dcebf9;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.18);padding:5px 11px;border-radius:13px}
.nav a.on{background:#fff;color:#12304b;font-weight:700;border-color:#fff}
main{padding:12px 12px 0;max-width:760px;margin:0 auto}
.kpis{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.kpi{flex:1 1 calc(50% - 5px);min-width:0;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;box-shadow:var(--shadow)}
.kpi b{display:block;font-size:19px;color:var(--pri);line-height:1.3;white-space:nowrap}
.kpi span{font-size:10.5px;color:var(--sub)}
.sec{margin-bottom:16px}
.sec h2{font-size:12.5px;color:var(--pri);display:flex;align-items:center;gap:8px;padding:4px 2px 8px}
.sec h2::before{content:"";width:3px;height:13px;background:var(--acc);border-radius:2px}
.sec h2 span{margin-left:auto;font-size:10.5px;color:var(--sub);font-weight:400}
.card{display:block;background:var(--card);border-radius:12px;padding:11px 13px;margin-bottom:8px;box-shadow:var(--shadow);border-left:3px solid transparent}
.card.hl{border-left-color:var(--hl);background:var(--hlbg)}
.card .t{font-size:14px;font-weight:600;line-height:1.45}
.card .u{font-size:11px;color:var(--acc);font-weight:600;margin-bottom:2px}
.card .m{font-size:12px;color:#5c6d80;margin-top:5px;line-height:1.65}
.card .row{display:flex;gap:8px;align-items:baseline;margin-top:4px}
.card .amt{font-size:12px;color:var(--hl);font-weight:700}
.card .d{font-size:10.5px;color:#a3b1c0;margin-left:auto}
.empty{text-align:center;color:var(--sub);font-size:12.5px;padding:30px 0}
.foot{text-align:center;font-size:10.5px;color:var(--sub);padding:16px 10px 4px;line-height:1.9}

.cards{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;-webkit-overflow-scrolling:touch;padding:2px 0 12px;scrollbar-width:none}
.cards::-webkit-scrollbar{display:none}
.big{flex:0 0 100%;scroll-snap-align:center;background:var(--card);border-radius:18px;padding:20px 18px;box-shadow:0 4px 18px rgba(16,36,56,.10);border-top:4px solid var(--pri)}
.big .unit{display:inline-block;font-size:12px;color:#fff;background:var(--acc);padding:2px 9px;border-radius:6px;font-weight:700;letter-spacing:.5px}
.big h2{font-size:26px;line-height:1.3;margin:8px 0 2px}
.big .role{font-size:13px;color:var(--sub);margin-bottom:12px}
.big .line{display:flex;gap:8px;font-size:13px;margin:7px 0;line-height:1.6}
.big .line b{flex:0 0 58px;color:var(--sub);font-weight:600;font-size:11.5px;padding-top:2px}
.big .memo{background:#f4f8fb;border-left:3px solid var(--acc);border-radius:0 8px 8px 0;padding:9px 11px;font-size:12.5px;margin-top:10px;line-height:1.65;min-height:58px}
.big .ml{display:block;font-size:10px;color:var(--acc);font-weight:700;letter-spacing:1px;margin-bottom:2px}
.big .acts{display:flex;gap:8px;margin-top:14px}
.big .acts a{flex:1;text-align:center;font-size:12.5px;padding:11px 0;border-radius:11px;background:var(--pri);color:#fff}
.big .acts a.ghost{background:#eef3f8;color:var(--pri)}
.dots{display:flex;gap:6px;justify-content:center;padding:2px 0 12px}
.dots i{width:6px;height:6px;border-radius:50%;background:#cdd8e3}
.dots i.on{background:var(--pri);width:16px;border-radius:3px}
.pick{display:flex;gap:7px;overflow-x:auto;padding:0 0 10px;scrollbar-width:none}
.pick::-webkit-scrollbar{display:none}
.pick button{flex:0 0 auto;font-size:12px;padding:8px 13px;border-radius:14px;border:1px solid var(--line);background:var(--card);color:var(--sub);font-family:inherit}
.pick button.on{background:var(--pri);color:#fff;border-color:var(--pri);font-weight:600}
@media(min-width:700px){.big{flex:0 0 48%}}
</style>
</head>
<body>
<header><h1>🪪 接待速查卡</h1><div class="sub">拜访前 1 分钟看 · 大字一屏一人 · 横滑切换</div><div class="nav"><a href="changji.html">📇 常记</a><a href="biji.html">📘 笔记</a><a href="https://suzhou-renshi.github.io/suzhou-renshi/">🏛 人事</a><a href="riji.html">📖 日记</a><a href="week.html">✅ 周行动</a><a href="biz.html">💰 商机大盘</a><a href="card.html" class="on">🪪 速查卡</a><a href="map.html">🕸 关系图</a></div></header>
<main id="view"><div id="view"></div></main>
<div class="foot">数据来源：常记看板（只读汇总）· 内部资料 请勿外传</div>
<script src="kv_data.js"></script>
<script>var DATA=KV_DATA;

function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
var units=[];
DATA.forEach(function(u,i){
  if(/中国电信/.test(u.title))return;
  var hr=(u.hr&&u.hr.people)||[];
  var pn=0;(u.depts||[]).forEach(function(d){pn+=d.people.length;});
  if(!hr.length&&!pn&&!(u.projects||[]).length)return;
  var memo='';
  (u.projects||[]).forEach(function(p){if(!memo&&p.memo&&p.memo[0])memo='📅 '+p.memo[0].d+' '+p.memo[0].t;});
  if(!memo&&u.depts){u.depts.forEach(function(d){d.people.forEach(function(p){if(!memo&&p.memo&&p.memo[0])memo='📅 '+p.memo[0].d+' '+p.memo[0].t;});});}
  var opp=(u.projects||[]).filter(function(p){return p.st==='opp';}).length;
  units.push({i:i,title:u.title,sub:u.sub||'',top:hr[0]||null,depts:(u.depts||[]).map(function(d){return d.dept;}),pn:pn,opp:opp,memo:memo,addr:u.addr||'',biz:u.biz||null});
});
units.sort(function(a,b){return (b.top?1:0)-(a.top?1:0)||b.opp-a.opp;});
var cur=0;
function render(){
  var u=units[cur];
  var names=u.top?(u.top.name+(u.top.rl?' · '+u.top.rl:'')):'—';
  var biz='';
  if(u.biz){var parts=[];Object.keys(u.biz).forEach(function(k){if(u.biz[k])parts.push(k+' '+u.biz[k]);});biz=parts.join(' · ');}
  var h='<div class="cards"><div class="big">'
   +'<div class="unit">'+esc(u.title)+'</div>'
   +'<h2>'+esc(u.top?u.top.name:u.title)+'</h2>'
   +'<div class="role">'+esc(u.top?(u.top.rl||u.top.post||''):'一把手待补 · 可先找办公室主任')+'</div>'
   +'<div class="line"><b>对接部门</b><span>'+esc(u.depts.length?u.depts.join(' / '):'—')+'</span></div>'
   +'<div class="line"><b>对接人</b><span>'+u.pn+' 人 · 在跟商机 '+u.opp+' 个</span></div>'
   +(biz?'<div class="line"><b>业务在用</b><span>'+esc(biz)+'</span></div>':'')
   +(u.addr?'<div class="line"><b>地址</b><span>'+esc(u.addr)+'</span></div>':'')
   +'<div class="memo"><span class="ml">最近跟进</span>'+(u.memo?esc(u.memo):'暂无记录，拜访后记一条')+'</div>'
   +'<div class="acts"><a href="changji.html#u-'+u.i+'">打开常记卡片</a>'
   +(u.addr?'<a class="ghost" href="https://uri.amap.com/search?keyword='+encodeURIComponent('苏州 '+u.addr)+'" target="_blank" rel="noopener">导航</a>':'')
   +'</div></div></div>';
    h+='<div class="pick">'+units.map(function(x,k){return '<button data-k="'+k+'"'+(k===cur?' class="on"':'')+'>'+esc(x.title)+'</button>';}).join('')+'</div>';
  document.getElementById('view').innerHTML=h;
  document.querySelectorAll('.pick button').forEach(function(b){b.onclick=function(){cur=+b.dataset.k;render();};});
}
render();
</script>
</body>
</html>
