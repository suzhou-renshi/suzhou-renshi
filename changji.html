<style>
:root{--primary:#1c2f4a;--accent:#b79a4a;--bg:#f6f5f0;--card:#fff;--text:#1e2c3c;--text2:#6b7a90;--border:#d9dccb;--success:#16a34a;--warning:#d97706;--danger:#be123c;--info:#0891b2}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,"PingFang SC","Microsoft YaHei","Segoe UI",sans-serif;color:var(--text);line-height:1.65;background:linear-gradient(160deg,#faf9f5,#fff 45%,#e4dcc3);min-height:100vh;padding-bottom:60px;-webkit-font-smoothing:antialiased}
.wrap{max-width:720px;margin:0 auto;padding:14px 14px 0}
header{position:relative;border-radius:20px;padding:24px 22px 20px;color:#fff;overflow:hidden;background:linear-gradient(135deg,#22374f,#31506e 55%,#4a6b9c);box-shadow:0 8px 24px rgba(20,35,58,.28)}
header::after{content:"常";position:absolute;right:16px;top:0;font-size:96px;color:rgba(183,154,74,.15);font-family:serif;line-height:1}
h1{font-size:24px;font-weight:800;letter-spacing:2px}
.sub{font-size:12.5px;color:rgba(255,255,255,.85);margin-top:5px}
.badge-row{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.badge{font-size:11px;padding:3px 10px;border-radius:20px;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.22);color:#eef4fa}
.badge.hl{background:var(--accent);color:#14233a;font-weight:700;border:none}
.stats{display:flex;gap:14px;margin-top:14px}
.stat b{font-size:20px;color:#f2e6c2;font-weight:800;display:block}
.stat span{font-size:10.5px;color:#c9d6e2}
.sticky{position:sticky;top:0;z-index:30;padding:10px 0 8px;background:var(--bg);box-shadow:0 3px 10px rgba(20,40,60,.07)}
.searchbox{position:relative}
.searchbox input{width:100%;border:1px solid var(--border);background:#fff;border-radius:13px;padding:11px 36px 11px 38px;font-size:14px;outline:none;box-shadow:0 4px 12px rgba(20,40,60,.06)}
.searchbox input:focus{border-color:var(--accent)}
.searchbox .ic{position:absolute;left:12px;top:50%;transform:translateY(-50%);font-size:15px}
.searchbox .clr{position:absolute;right:11px;top:50%;transform:translateY(-50%);font-size:16px;color:#b6a88c;cursor:pointer;display:none}
.chips{display:flex;gap:8px;overflow-x:auto;padding:8px 2px 2px;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;font-size:12px;padding:6px 13px;border-radius:16px;background:#fff;border:1px solid var(--border);color:#5c6672;font-weight:600;white-space:nowrap;cursor:pointer;transition:.15s}
.chip:active{background:linear-gradient(135deg,#123a5e,#1d5177);color:#fff;border-color:transparent}
.chip.biz{background:linear-gradient(135deg,#92400e,#d9982f);color:#fff;border-color:transparent;font-weight:800}
.projline{display:flex;align-items:center;gap:4px;flex-wrap:wrap;font-size:11.5px;color:#5c6672;padding:7px 4px 1px}
.projline b{color:#92400e;font-weight:800}
.unit{margin-top:16px}
.uhead{display:flex;align-items:center;flex-wrap:wrap;gap:10px;padding:14px 16px;border-radius:14px;color:#fff;position:relative;overflow:hidden;background:linear-gradient(135deg,#2a3f5f,#0e2a47);box-shadow:0 5px 14px rgba(14,42,71,.22)}
.uhead::after{content:"企";position:absolute;right:12px;top:-8px;font-size:46px;color:rgba(232,200,122,.15);font-family:serif}
.uname{font-size:18px;font-weight:800;letter-spacing:.5px;position:relative;z-index:1}
.usub{font-size:11.5px;color:#c9d6e2;position:relative;z-index:1}
.ucount{margin-left:auto;font-size:11px;font-weight:700;background:rgba(232,200,122,.9);color:#123a5e;padding:3px 10px;border-radius:12px;position:relative;z-index:1}
.bizhead{background:linear-gradient(135deg,#92400e,#d9982f)!important;box-shadow:0 5px 14px rgba(146,64,14,.3)}
.bizhead::after{content:"商"}
.block{margin-top:10px;background:var(--card);border:1px solid var(--border);border-radius:12px;padding:12px 14px}
.block-title{font-size:13px;font-weight:800;color:var(--primary);margin-bottom:8px;display:flex;align-items:center;gap:6px}
.block-title::before{content:"";width:4px;height:13px;background:var(--accent);border-radius:2px}
.block-title .cnt{font-size:11px;color:var(--text2);font-weight:500;margin-left:auto}
.people{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.person{border:1px solid #e9e5d8;border-radius:9px;padding:8px 10px;background:#fbfaf6}
.p-top{display:flex;align-items:baseline;gap:6px}
.nm{font-size:14px;font-weight:700;color:var(--primary)}
.pf{font-size:10px;color:var(--text2)}
.rl{display:block;font-size:11px;color:var(--text2);margin:1px 0 4px}
.tags{display:flex;flex-wrap:wrap;gap:4px}
.tag{font-size:9.5px;padding:1px 7px;border-radius:5px;border:1px solid}
.t-key{background:#e7f6ec;color:#15803d;border-color:#86efac}
.t-biz{background:#eef2ff;color:#4338ca;border-color:#c7d2fe}
.t-feat{background:#fff7ed;color:#c2410c;border-color:#fdba74}
.t-risk{background:#fde8e8;color:#b02a37;border-color:#f5b3b3}
.pn{display:block;font-size:10.5px;color:var(--text);background:#f1efe8;border-left:3px solid var(--accent);padding:4px 8px;border-radius:3px;margin-top:4px}
.hr-meta{display:grid;grid-template-columns:1fr 1fr;gap:4px 10px;margin-top:5px;font-size:10.5px;color:#5c6672}
.hr-meta .k{color:#9a8a6e}
.hr-meta .v{font-weight:600;color:var(--text)}
.hr-track{margin-top:5px;font-size:10px;color:#4a5a6b;border-top:1px dashed var(--border);padding-top:4px}
.proj{border:1px solid #ebe6d8;border-radius:8px;padding:8px 10px;margin-bottom:6px;background:#fbfaf6}
.proj.hilite{outline:2px solid #d97706;outline-offset:1px}
.proj .pt{font-size:13px;font-weight:700;color:var(--text);display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.proj .amt{margin-left:auto;font-size:11px;font-weight:700;color:#fff;padding:1px 8px;border-radius:10px;white-space:nowrap}
.a-signed{background:var(--success)}.a-opp{background:var(--warning)}.a-void{background:#9ca3af}
.keytag{font-size:9px;background:var(--danger);color:#fff;padding:1px 6px;border-radius:4px;font-weight:700}
.proj .note{font-size:10.5px;color:var(--text2);margin-top:3px}
.proj .meta2{display:flex;gap:10px;margin-top:3px;font-size:10px;color:#8a7d63;flex-wrap:wrap}
.pl{font-size:10px;color:#b45309;margin-top:3px;background:#fff7e6;border-radius:5px;padding:3px 7px}
.biz{border:1px solid #f0d9a0;background:linear-gradient(135deg,#fffdf5,#fff7e6);border-radius:10px;padding:8px 10px;margin-bottom:7px}
.biz-row{display:flex;align-items:center;gap:6px;flex-wrap:wrap;cursor:pointer}
.biz-name{font-size:13.5px;font-weight:800;color:#78350f}
.biz-unit{font-size:10px;background:#123a5e;color:#fff;padding:1px 7px;border-radius:8px;font-weight:700}
.biz-amt{font-size:11px;font-weight:800;color:#b45309}
.biz-time{font-size:10px;color:#9a8a6e}
.biz-go{margin-left:auto;font-size:10.5px;color:#fff;background:#d97706;padding:2px 10px;border-radius:10px;cursor:pointer;font-weight:700}
.biz-latest{font-size:11px;color:#7c6f57;margin-top:4px;line-height:1.5}

.biz-logs .blg b{color:#b45309;font-weight:700;font-size:10px}
.dept-sub{margin-top:9px}
.dept-sub .dt{font-size:12px;font-weight:700;color:var(--primary);margin-bottom:6px}

    if(p.education)h+='<span class="m"><span class="k">学历</span> <span class="v">'+esc(p.education)+'</span></span>';
    h+='</div>';
    if(p.track)h+='<div class="hr-track"><span class="k">轨迹</span> '+esc(p.track)+'</div>';
  }
  if(p.pn)h+='<span class="pn">'+esc(p.pn)+'</span>';
  return h+'</div>';
}
function projItem(p,id){
  var stc=p.st==='signed'?['已签约','a-signed']:(p.st==='void'?['作废','a-void']:['商机','a-opp']);
  var latest=(p.logs&&p.logs.length)?('<div class="pl">📅 '+esc(p.logs[0].d)+' '+esc(p.logs[0].t)+'</div>'):'';
  return '<div class="proj"'+(id?' id="'+id+'"':'')+'><div class="pt">'+esc(p.t)+(p.key?'<span class="keytag">★重点</span>':'')
    +'<span class="amt '+stc[1]+'">'+esc(p.amt||'—')+'</span></div>'
    +'<div class="meta2">'+(p.time?'<span>'+esc(p.time)+'</span>':'')+(p.income?'<span>回款 '+esc(p.income)+'</span>':'')+'<span>'+stc[0]+'</span></div>'
    +(p.note?'<div class="note">'+esc(p.note)+'</div>':'')
    +latest+'</div>';
}
function render(list){
  var el=document.getElementById('list'),h='';
  list.forEach(function(u){
    if(u.isPartner){
      var pc=0;u.depts.forEach(function(d){pc+=d.people.length;});
      var contactHtml='<div class="block"><div class="block-title">业务分类 · 公司 <span class="cnt">'+pc+' 家</span></div>';
      u.depts.forEach(function(d){
        contactHtml+='<div class="dept-sub"><div class="dt">'+esc(d.dept)+'</div><div class="people">';
        d.people.forEach(function(p){contactHtml+=personHtml(p,false);});
        contactHtml+='</div></div>';
      });
      contactHtml+='</div>';
      h+='<div class="unit" id="u-'+u._i+'"><div class="uhead"><span class="uname">'+esc(u.title)+'</span><span class="usub">'+esc(u.sub)+'</span><span class="ucount">'+pc+' 家公司</span></div>'+contactHtml+'</div>';
      return;
    }
    var pcount=0;(u.depts||[]).forEach(function(d){pcount+=d.people.length;});
    if(!pcount&&u.flat)pcount=u.flat.length;
    var proj=(u.projects||[]).length, hrp=u.hr?u.hr.people.length:0;
    var total=hrp+pcount;
    var ucountTxt=total+' 人 · '+proj+' 项目';
    var hrHtml='';
    if(u.hr&&u.hr.people.length){
      hrHtml='<div class="block"><div class="block-title">领导班子 <span class="cnt">'+hrp+'人 · '+(u.hr.lv||'')+'</span></div><div class="people">';
      u.hr.people.forEach(function(b){hrHtml+=personHtml(b,true);});
      hrHtml+='</div></div>';
    }
    var contactTitle=(u.depts&&u.depts.length)?'部门 · 下属单位':'条线对接';
    var contactHtml='<div class="block"><div class="block-title">'+contactTitle+' <span class="cnt">'+pcount+'人</span></div>';
    if(u.depts&&u.depts.length){
      u.depts.forEach(function(d){
        contactHtml+='<div class="dept-sub"><div class="dt">'+esc(d.dept)+' <span style="font-size:10px;color:#9a8a6e">'+d.people.length+'人</span></div><div class="people">';
        d.people.forEach(function(p){contactHtml+=personHtml(p,false);});
        contactHtml+='</div></div>';
      });
    }else if(u.flat&&u.flat.length){
      contactHtml+='<div class="people">';
      u.flat.forEach(function(p){contactHtml+=personHtml(p,false);});
      contactHtml+='</div>';
    }else{
      contactHtml+='<div style="font-size:11px;color:#999;padding:4px 0">暂无在册对接人 · 持续拓展中</div>';
    }
    contactHtml+='</div>';
    var projHtml='';
    if(proj){
      projHtml='<div class="block"><div class="block-title">ICT 项目 <span class="cnt">'+proj+'个</span></div>';
      var ui=u._i;
      var opp=(u.projects||[]).filter(function(x){return x.st==='opp';});
      var signed=(u.projects||[]).filter(function(x){return x.st==='signed';});
      var vd=(u.projects||[]).filter(function(x){return x.st==='void';});
      var grp=function(arr,label){if(!arr.length)return'';var g='<div class="dept-sub"><div class="dt">'+label+' '+arr.length+'</div>';arr.forEach(function(p){g+=projItem(p,'p-'+ui+'-'+p._pi);});return g+'</div>';};
      projHtml+=grp(opp,'重点 · 商机')+grp(signed,'已签约')+grp(vd,'作废');
      projHtml+='</div>';
    }
    h+='<div class="unit" id="u-'+u._i+'"><div class="uhead"><span class="uname">'+esc(u.title)+'</span><span class="usub">'+esc(u.sub)+'</span><span class="ucount">'+ucountTxt+'</span></div>'
      +hrHtml+contactHtml+projHtml+'</div>';
  });
  el.innerHTML=h||'<div style="text-align:center;color:#999;padding:40px">未找到匹配内容</div>';
}
function renderBiz(list){
  var el=document.getElementById('bizboard'),h='',bcount=0;
  list.forEach(function(u){
    if(u.isPartner||!u.projects)return;
    (u.projects||[]).forEach(function(p){
      if(p.st==='opp'&&p.key)bcount++;
    });
  });
  var kw=(document.getElementById('q').value||'').trim().toLowerCase();
  h+='<div class="unit"><div class="uhead bizhead"><span class="uname">★ 重点商机</span><span class="usub">每周更新进展 · 点击展开历史 · 「定位」直达项目</span><span class="ucount">'+bcount+' 个在跟</span></div><div class="block" style="padding:10px 12px">';
  list.forEach(function(u){
    if(u.isPartner||!u.projects)return;
    (u.projects||[]).forEach(function(p){
      if(!(p.st==='opp'&&p.key))return;
      if(kw){
        var all=(p.t+p.amt+p.note+JSON.stringify(p.logs||[])+(u.title+u.sub)).toLowerCase();
        if(all.indexOf(kw)<0)return;
      }
      var logs=p.logs||[];
      var uid=(u._i!=null?u._i:-1), upi=p._pi;
      var rowId='br-'+uid+'-'+upi;
      h+='<div class="biz"><div class="biz-row" id="'+rowId+'">'
        +'<span class="biz-name">'+esc(p.t)+'</span>'
        +'<span class="biz-unit">'+esc(u.short||u.title)+'</span>'
        +'<span class="biz-amt">'+esc(p.amt||'—')+'</span>'
        +(p.time?'<span class="biz-time">'+esc(p.time)+'</span>':'')
        +'<span class="biz-go" data-goto="'+uid+'-'+upi+'">定位</span>'
        +'</div>';
      if(logs.length){
        h+='<div class="biz-latest">📅 <b style="color:#b45309">'+esc(logs[0].d)+'</b> '+esc(logs[0].t)+'</div>';
      }else if(p.note){
        h+='<div class="biz-latest">'+esc(p.note)+'</div>';
      }
      if(logs.length>1){
        h+='<div class="biz-logshd">↓ 展开 '+logs.length+' 条进展记录（含历史）</div>';
        h+='<div class="biz-logs">';
        logs.slice(1).forEach(function(lg){h+='<div class="blg"><b>'+esc(lg.d)+'</b>　'+esc(lg.t)+'</div>';});
        h+='</div>';
      }
      h+='</div>';
    });
  });
  if(bcount===0)h+='<div style="font-size:11px;color:#a1906f;padding:6px 2px">暂无重点商机</div>';
  h+='</div></div>';
  el.innerHTML=h;
}
var sU=0,sPe=0,sHr=0,sPj=0,sOpp=0,sKey=0,sSigned=0,sVoid=0;
DATA.forEach(function(x){
  if(x.isPartner)return;
  sU++;var pc=0;(x.depts||[]).forEach(function(d){pc+=d.people.length});if(!pc&&x.flat)pc=x.flat.length;sPe+=pc;
  sPj+=(x.projects||[]).length;if(x.hr)sHr+=x.hr.people.length;
  (x.projects||[]).forEach(function(p){
    if(p.st==='opp'){sOpp++;if(p.key)sKey++;}
    else if(p.st==='signed')sSigned++;
    else sVoid++;
  });
});
document.getElementById('s-unit').textContent=sU;document.getElementById('s-people').textContent=sPe;
document.getElementById('s-hr').textContent=sHr;document.getElementById('s-proj').textContent=sPj;
document.getElementById('projline').innerHTML='项目情况：商机 <b>'+sOpp+'</b>（★重点 <b>'+sKey+'</b>）· 签约 <b>'+sSigned+'</b> · 作废 <b>'+sVoid+'</b> · 共 <b>'+sPj+'</b> 个';
function scrollToEl(el){
  var st=document.querySelector('.sticky');
  var stickyH=st?st.offsetHeight:0;
  var top=el.getBoundingClientRect().top+window.scrollY-stickyH-8;
  window.scrollTo({top:top,behavior:'auto'});
}
window.gotoProj=function(i,pi){
  var q=document.getElementById('q');
  if(q.value){q.value='';document.getElementById('clr').style.display='none';doRender();}
  setTimeout(function(){
    var el=document.getElementById('p-'+i+'-'+pi);
    if(el){el.classList.add('hilite');setTimeout(function(){el.classList.remove('hilite');},2500);scrollToEl(el);}
  },70);
};
function baseData(){
  return DATA.map(function(u,i){
    var c=Object.assign({},u);
    c._i=i;
    c.projects=(u.projects||[]).map(function(p,pi){var q=Object.assign({},p);q._pi=pi;return q;});
    return c;
  });
}
function doRender(){
  var kw=(document.getElementById('q').value||'').trim().toLowerCase();
  var base=baseData();
  var ds;
  if(!kw){ds=base;}
  else{
    ds=base.map(function(u){
      if(u.isPartner){
        var ph=(u.depts||[]).map(function(d){var f=d.people.filter(function(p){return JSON.stringify(p).toLowerCase().indexOf(kw)>=0;});return {dept:d.dept,people:f};}).filter(function(x){return x.people.length;});
        if(ph.length)return Object.assign({},u,{depts:ph});
        return null;
      }
      var htxt=(u.title+u.sub).toLowerCase();
      if(htxt.indexOf(kw)>=0)return u;
      var phits=(u.depts||[]).map(function(d){var f=d.people.filter(function(p){return JSON.stringify(p).toLowerCase().indexOf(kw)>=0;});return {dept:d.dept,people:f};}).filter(function(x){return x.people.length;});
      var fhits=(u.flat||[]).filter(function(p){return JSON.stringify(p).toLowerCase().indexOf(kw)>=0;});
      var ph=(u.projects||[]).filter(function(p){return JSON.stringify(p).toLowerCase().indexOf(kw)>=0;});
      var hrp=u.hr?u.hr.people.filter(function(p){return JSON.stringify(p).toLowerCase().indexOf(kw)>=0;}):[];
      if(phits.length||fhits.length||ph.length||hrp.length)return {title:u.title,short:u.short,sub:u.sub,depts:phits,flat:fhits,projects:ph,hr:hrp.length?{people:hrp,lv:u.hr.lv}:null,_i:u._i};
      return null;
    }).filter(Boolean);
  }
  render(ds);
  renderBiz(ds);
}
var chipsEl=document.getElementById('chips');
var bizChip=document.createElement('div');
bizChip.className='chip biz';bizChip.textContent='★重点商机';
bizChip.onclick=function(){scrollToEl(document.getElementById('bizboard').firstChild);};
chipsEl.appendChild(bizChip);
DATA.forEach(function(u,i){
  var c=document.createElement('div');
  c.className='chip'; c.textContent=u.short||u.title;
  c.onclick=function(){ goto(i); };
  chipsEl.appendChild(c);
});
function goto(i){
  var q=document.getElementById('q');
  if(q.value){q.value='';document.getElementById('clr').style.display='none';doRender();}
  setTimeout(function(){
    var el=document.getElementById('u-'+i);
    if(el) scrollToEl(el);
  },60);
}
document.getElementById('q').addEventListener('input',function(){var v=this.value;document.getElementById('clr').style.display=v?'block':'none';doRender();});
document.getElementById('clr').addEventListener('click',function(){var q=document.getElementById('q');q.value='';document.getElementById('clr').style.display='none';doRender();});
// 回到顶部按钮：滚动超过一屏出现
var backTopBtn=document.getElementById('backTop');
window.addEventListener('scroll',function(){
  if(window.scrollY>window.innerHeight*0.9){backTopBtn.classList.add('show');}
  else{backTopBtn.classList.remove('show');}
},{passive:true});
backTopBtn.addEventListener('click',function(){window.scrollTo({top:0,behavior:'auto'});});
// 商机板块交互：点击行展开/收起历史，点击"定位"直达项目
document.getElementById('bizboard').addEventListener('click',function(e){
  var go=e.target.closest('.biz-go');
  if(go){
    var pr=go.getAttribute('data-goto').split('-');
    gotoProj(parseInt(pr[0],10),parseInt(pr[1],10));
    return;
  }
  var row=e.target.closest('.biz-row');
  if(row){
    var logs=row.parentNode.querySelector('.biz-logs');
    if(logs) logs.style.display=(logs.style.display==='block')?'none':'block';
  }
});
doRender();
</script>
</body>
</html>
